[workspace]
resolver = "2"
members = ["crates/sketch-core", "crates/sketch-app"]

[workspace.package]
version = "0.3.13"
edition = "2021"
license-file = "LICENSE"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"

[profile.release]
lto = "thin"
