# Builds the Windows downloads and attaches them to a GitHub Release.
#
# Release:  bump `version` in Cargo.toml, commit, then push a matching tag:
#             git tag v0.1.30 && git push origin v0.1.30
# Dry run:  Actions > Release > Run workflow. The files are kept as a run
#           artifact instead of being published.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), 'version\s*=\s*"([^"]+)"').Groups[1].Value
          if ('${{ github.ref_name }}' -ne "v$version") { throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $version." }

      # WiX 5 runs on .NET; the build itself needs the MSVC Rust toolchain,
      # the Windows SDK (rc.exe) and .NET Framework 4 (csc.exe), all of which
      # the windows-latest image already has.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Fetch crates
        run: cargo fetch --locked

      - name: Build portable zip
        shell: pwsh
        run: ./tools/package.ps1 -NativePreview

      - name: Build MSI installer
        shell: pwsh
        run: ./tools/installer.ps1 -FetchWix -SkipPackage -Test

      - uses: actions/upload-artifact@v4
        with:
          name: SketchRust-windows-x64
          path: dist/*

      - name: Publish to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --prerelease --title "Sketch Rust $($tag.TrimStart('v'))" `
              --notes "Download the .msi below to install. Step-by-step instructions: ${{ github.server_url }}/${{ github.repository }}/blob/main/docs/INSTALL.md"
          }
          gh release upload $tag (Get-ChildItem dist -File).FullName --clobber
