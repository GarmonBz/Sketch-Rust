<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <title>Floorplan drawing cursor</title>
  <!-- Transparent background; exact pointer hotspot: 16,16 -->
  <g fill="none" stroke-linecap="square" stroke-linejoin="round">
    <!-- White keyline keeps the cursor visible against dark floorplans. -->
    <g stroke="#FFFFFF" stroke-width="4">
      <circle cx="16" cy="16" r="7.5"/>
      <path d="M16 2V6 M16 26V30 M2 16H6 M26 16H30"/>
    </g>
    <!-- Crisp dark drawing lines stay visible against white canvases. -->
    <g stroke="#17212B" stroke-width="1.8">
      <circle cx="16" cy="16" r="7.5"/>
      <path d="M16 2V6 M16 26V30 M2 16H6 M26 16H30"/>
    </g>
  </g>
  <circle cx="16" cy="16" r="2.7" fill="#FFFFFF"/>
  <circle cx="16" cy="16" r="1.3" fill="#17212B"/>
</svg>
