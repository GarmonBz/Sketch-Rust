[package]
name = "sketch-setup"
description = "Per-user Windows installer for Sketch Rust (payload embedded at build time)."
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
flate2 = "1"

[build-dependencies]
flate2 = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }
