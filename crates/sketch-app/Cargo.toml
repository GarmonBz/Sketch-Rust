[package]
name = "sketch-app"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[features]
# Keep GPU acceleration in desktop builds; headless CI can select tiny-skia
# alone with --no-default-features instead of opening a GPU device per test.
default = ["gpu"]
gpu = ["iced/wgpu"]
# Dev-only: iced-mcp bridge for Cursor/Claude/Codex. Leave off for release builds.
agent = ["dep:iced-mcp"]

[dependencies]
sketch-core = { path = "../sketch-core" }
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "crisp", "web-colors", "canvas", "image", "svg", "advanced"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
web-time = { workspace = true }
getrandom = "0.3"
uuid = "1"
serde_json_canonicalizer = "0.3"
# PNG export uses the canvas renderer on an offscreen software surface.
iced_runtime = "0.14"
resvg = "0.45.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iced = { version = "0.14", default-features = false, features = ["thread-pool", "linux-theme-detection", "x11", "wayland"] }
btleplug = "0.11"
tokio = { version = "1", features = ["rt", "time"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
iced-mcp = { version = "0.3", optional = true, default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "webgl"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
gloo-timers = { version = "0.3", features = ["futures"] }
console_error_panic_hook = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Data_Pdf", "Storage_Streams", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_WinRT", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_Security"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSThread"] }
objc2-app-kit = { version = "0.3", features = ["NSScreen", "NSWindow", "NSView", "NSApplication", "NSImage"] }
objc2-core-graphics = { version = "0.3", features = ["CGDirectDisplay", "CGError"] }
objc2-pdf-kit = { version = "0.3", features = ["PDFDocument", "PDFPage", "objc2-app-kit"] }

[package.metadata.bundle]
name = "Sketch Rust"
identifier = "com.propertyhackers.sketchrust"
icon = ["../../assets/macos/AppIcon.icns"]
category = "public.app-category.graphics-design"
short_description = "Floor-plan sketching for appraisers"
long_description = """
Sketch Rust is a native floor-plan sketching program for appraisers.
"""

# Appended into Info.plist by cargo-bundle (Bluetooth DISTO via btleplug/CoreBluetooth).
[package.metadata.bundle.osx]
info_plist_exts = ["../../assets/macos/info_plist_ext.xml"]

[dev-dependencies]
# Headless end-to-end harness: runs the real program (incl. subscriptions)
# with scripted mouse/keyboard input and headless screenshots — no window,
# no real mouse. See src/e2e.rs and tools/e2e.sh.
iced_test = "0.14.0"
png = "0.18"
