[package]
name = "sketch-app"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
sketch-core = { path = "../sketch-core" }
iced = { version = "0.14", features = ["canvas", "image", "svg", "advanced"] }
rfd = "0.15"
btleplug = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tokio = { version = "1", features = ["rt", "time"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
getrandom = "0.3"
uuid = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json_canonicalizer = "0.3"
# PNG export uses the canvas renderer on an offscreen software surface.
iced_runtime = "0.14"
resvg = "0.45.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Data_Pdf", "Storage_Streams", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_WinRT", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_Security"] }

[dev-dependencies]
# Headless end-to-end harness: runs the real program (incl. subscriptions)
# with scripted mouse/keyboard input and headless screenshots — no window,
# no real mouse. See src/e2e.rs and tools/e2e.sh.
iced_test = "0.14.0"
png = "0.18"
